<!-- ============================================================
     ADMIN USER — LIST VIEW
     ============================================================ -->
<div class="shopify-main-container" *ngIf="!addFlag">

  <h2 class="shopify-page-title">Admin Users</h2>

  <!-- Search row -->
  <div class="shopify-search-row">
    <div>
      <label class="shopify-field-label" for="searchName">Search Name</label>
      <div class="shopify-input-group">
        <span class="shopify-input-group__prefix"><i class="bi bi-search"></i></span>
        <input type="text" class="shopify-input" placeholder="Search admin user" id="searchName"
          [(ngModel)]="searchName" (input)="adminUserSearch()">
      </div>
    </div>
  </div>

  <!-- Actions row -->
  <div class="shopify-actions-row">
    <button type="button" class="btn-shopify btn-shopify--primary" (click)="addAdminUser()">
      <i class="bi bi-plus-lg"></i> Add Admin User
    </button>
  </div>

  <!-- Loader -->
  <div class="shopify-loading" *ngIf="spinnerDataLoad">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p>Loading admin users...</p>
  </div>

  <ng-container *ngIf="!spinnerDataLoad">

    <!-- Empty state -->
    <div class="shopify-empty" *ngIf="adminUserList.length === 0">
      <h5>Admin user not found</h5>
      <p>No admin users match your search.</p>
    </div>

    <ng-container *ngIf="adminUserList.length > 0">

      <!-- Desktop table -->
      <div class="shopify-table-wrap">
        <table class="shopify-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Login ID</th>
              <th>Password</th>
              <th>First</th>
              <th>Last</th>
              <th>Role</th>
              <th>Email</th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let emp of pagedAdminUserList; let i = index"
              [ngClass]="{'is-active': activeRow === rowIndex(i)}">
              <td>{{ emp.userId }}</td>
              <td>
                <input type="text" class="shopify-input" [(ngModel)]="emp.loginId"
                  [disabled]="!enabledEdit[rowIndex(i)]">
              </td>
              <td>
                <input type="text" class="shopify-input" [(ngModel)]="emp.loginPassword"
                  [disabled]="!enabledEdit[rowIndex(i)]">
              </td>
              <td>
                <input type="text" class="shopify-input" [(ngModel)]="emp.firstName"
                  [disabled]="!enabledEdit[rowIndex(i)]">
              </td>
              <td>
                <input type="text" class="shopify-input" [(ngModel)]="emp.lastName"
                  [disabled]="!enabledEdit[rowIndex(i)]">
              </td>
              <td>
                <select class="shopify-input" [(ngModel)]="emp.userRole" [disabled]="!enabledEdit[rowIndex(i)]">
                  <option *ngFor="let role of roles" [ngValue]="role">
                    {{ role }}
                  </option>
                </select>
              </td>
              <td>
                <input type="text" class="shopify-input" [(ngModel)]="emp.email" [disabled]="!enabledEdit[rowIndex(i)]">
              </td>
              <td>
                <div class="shopify-table__actions">
                  <button *ngIf="!enabledEdit[rowIndex(i)]" class="btn-shopify btn-shopify--outline btn-shopify--icon"
                    title="Edit" (click)="startEdit(rowIndex(i))">
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button *ngIf="enabledEdit[rowIndex(i)]" class="btn-shopify btn-shopify--success btn-shopify--icon"
                    title="Save" (click)="onSave(rowIndex(i))">
                    <i class="bi bi-check-lg"></i>
                  </button>
                  <button class="btn-shopify btn-shopify--danger btn-shopify--icon" title="Delete"
                    (click)="onDelete(rowIndex(i))">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Mobile cards -->
      <div class="shopify-mobile-list">
        <div class="shopify-mobile-card" *ngFor="let emp of pagedAdminUserList; let i = index"
          [ngClass]="{'is-active': activeRow === rowIndex(i)}">

          <h6 class="fw-bold mb-2">{{ emp.firstName }} {{ emp.lastName }}</h6>

          <div class="shopify-mobile-card__field">
            <label class="shopify-field-label--sm">Login ID</label>
            <input type="text" class="shopify-input" [(ngModel)]="emp.loginId" [disabled]="!enabledEdit[rowIndex(i)]">
          </div>
          <div class="shopify-mobile-card__field">
            <label class="shopify-field-label--sm">Password</label>
            <input type="text" class="shopify-input" [(ngModel)]="emp.loginPassword"
              [disabled]="!enabledEdit[rowIndex(i)]">
          </div>
          <div class="shopify-mobile-card__field">
            <label class="shopify-field-label--sm">First Name</label>
            <input type="text" class="shopify-input" [(ngModel)]="emp.firstName" [disabled]="!enabledEdit[rowIndex(i)]">
          </div>
          <div class="shopify-mobile-card__field">
            <label class="shopify-field-label--sm">Last Name</label>
            <input type="text" class="shopify-input" [(ngModel)]="emp.lastName" [disabled]="!enabledEdit[rowIndex(i)]">
          </div>
          <div class="shopify-mobile-card__field">
            <label class="shopify-field-label--sm">Role</label>
            <select class="shopify-input" [(ngModel)]="emp.userRole" [disabled]="!enabledEdit[rowIndex(i)]">
              <option *ngFor="let role of roles" [ngValue]="role">
                {{ role }}
              </option>
            </select>
          </div>
          <div class="shopify-mobile-card__field">
            <label class="shopify-field-label--sm">Email</label>
            <input type="text" class="shopify-input" [(ngModel)]="emp.email" [disabled]="!enabledEdit[rowIndex(i)]">
          </div>

          <div class="shopify-mobile-card__actions">
            <button *ngIf="!enabledEdit[rowIndex(i)]" class="btn-shopify btn-shopify--outline btn-shopify--sm"
              (click)="startEdit(rowIndex(i))">
              <i class="bi bi-pencil"></i> Edit
            </button>
            <button *ngIf="enabledEdit[rowIndex(i)]" class="btn-shopify btn-shopify--success btn-shopify--sm"
              (click)="onSave(rowIndex(i))">
              <i class="bi bi-check-lg"></i> Save
            </button>
            <button class="btn-shopify btn-shopify--danger btn-shopify--sm" (click)="onDelete(rowIndex(i))">
              <i class="bi bi-trash"></i> Delete
            </button>
          </div>
        </div>
      </div>

      <!-- Pagination (Shopify-style Previous / Next) -->
      <div class="shopify-pager" *ngIf="totalPages > 1">
        <button class="btn-shopify btn-shopify--outline btn-shopify--sm" [disabled]="page <= 1"
          (click)="goToPage(page - 1)">
          <i class="bi bi-chevron-left"></i> Previous
        </button>
        <span class="shopify-pager__info">Page {{ page }} of {{ totalPages }}</span>
        <button class="btn-shopify btn-shopify--outline btn-shopify--sm" [disabled]="page >= totalPages"
          (click)="goToPage(page + 1)">
          Next <i class="bi bi-chevron-right"></i>
        </button>
      </div>

    </ng-container>
  </ng-container>
</div>

<!-- ============================================================
     ADMIN USER — ADD FORM
     ============================================================ -->
<div class="shopify-main-container" *ngIf="addFlag">

  <div class="shopify-actions-row">
    <button class="btn-shopify btn-shopify--outline" (click)="addAdminUser()">
      <i class="bi bi-arrow-left"></i> Back to Users
    </button>
  </div>

  <div class="shopify-card">
    <div class="shopify-card__header">Add New Admin User</div>
    <div class="shopify-card__body">

      <div class="shopify-grid-3">
        <div>
          <label class="shopify-field-label">Login ID</label>
          <input type="text" class="shopify-input" id="loginId-new" placeholder="Login ID">
        </div>
        <div>
          <label class="shopify-field-label">Password</label>
          <input type="password" class="shopify-input" id="loginPassword-new" placeholder="Password">
        </div>
        <div>
          <label class="shopify-field-label">First Name</label>
          <input type="text" class="shopify-input" id="firstName-new" placeholder="First Name">
        </div>
        <div>
          <label class="shopify-field-label">Last Name</label>
          <input type="text" class="shopify-input" id="lastName-new" placeholder="Last Name">
        </div>
        <div>
          <label class="shopify-field-label">User Role</label>
          <select class="shopify-input" id="userRole-new">
            <option value="">User Role</option>
            <option *ngFor="let role of roles" [ngValue]="role">
              {{ role }}
            </option>
          </select>
        </div>
        <div>
          <label class="shopify-field-label">Email</label>
          <input type="email" class="shopify-input" id="email-new" placeholder="Email">
        </div>
      </div>

      <div class="shopify-actions-row mt-3">
        <button class="btn-shopify btn-shopify--primary" (click)="onSave(-1)">
          <i class="bi bi-save"></i> Save
        </button>
        <button class="btn-shopify btn-shopify--outline" (click)="addFlag=false">
          Cancel
        </button>
      </div>

    </div>
  </div>

</div>
