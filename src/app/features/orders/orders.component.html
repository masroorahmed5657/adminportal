<!-- Card Start -->
<div class="card border border-2 py-5">
  <div class="card-body">



    <!-- Toolbar -->
    <div class="card border border-2 shadow rounded-4 mb-4">
      <div class="card-body p-3">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
          <!-- Left Section (Filters) -->
          <div class="d-flex flex-wrap align-items-center gap-4">
            <div class="row g-3 align-items-center">
              <!-- Status Filter -->
              <div class="col-12 col-lg-auto">
                <div class="d-flex flex-column flex-lg-row align-items-start align-items-lg-center gap-2">
                  <label class="fw-bold text-secondary mb-0 small">Status:</label>

                  <div class="btn-group btn-group-sm w-100 w-lg-auto" role="group">
                    <input type="radio" class="btn-check" id="statusNew" [(ngModel)]="searchType" [value]="1"
                      (click)="onSearchType(1)">
                    <label for="statusNew" class="btn btn-outline-dark w-100">NEW</label>

                    <input type="radio" class="btn-check" id="statusPrinted" [(ngModel)]="searchType" [value]="2"
                      (click)="onSearchType(2)">
                    <label for="statusPrinted" class="btn btn-outline-dark w-100">PRINTED</label>

                    <input type="radio" class="btn-check" id="statusClosed" [(ngModel)]="searchType" [value]="3"
                      (click)="onSearchType(3)">
                    <label for="statusClosed" class="btn btn-outline-dark w-100">CLOSED</label>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Right Section (Actions) -->
          <div class="d-flex flex-wrap gap-2">
            <select id="orderType" class="form-select form-select-sm shadow-sm" [(ngModel)]="selectedOrderType"
              (change)="loadOrders()">
              <option value="DINEIN">DINEIN</option>
              <option value="PICKUP">PICKUP</option>
              <option value="DELIEVRY">DELIVERY</option>
            </select>
            <!-- <button class="btn btn-success btn-sm fw-bold" (click)="onSearch()">Search</button>
            <button class="btn btn-warning btn-sm fw-bold" (click)="exportPDF()">Export</button>
            <button class="btn btn-outline-primary btn-sm fw-bold" (click)="resetOrderNumber()">Reset</button> -->
            <button class="btn btn-outline-danger btn-sm fw-bold" (click)="closeAllPrintedOrders()">Close All
              Orders</button>
          </div>
          <button class="btn btn-info btn-sm fw-bold" (click)="loadOrders()"> Search </button>

        </div>
      </div>
    </div>

    <!-- Loader -->
    <div *ngIf="spinnerDataLoad" class="d-flex justify-content-center align-items-center min-vh-50">
      <div class="spinner-border text-primary" role="status" style="width:3rem;height:3rem;">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Accutal page content -->
    <div *ngIf="!spinnerDataLoad">

      <!-- Toggle Button -->
      <div class="d-flex justify-content-end mb-3" *ngIf="orderViewList">
        <button class="btn btn-outline-primary rounded-circle shadow-sm" (click)="isListView = !isListView">
          <i *ngIf="!isListView" class="ri-list-check-2 fs-5"></i>
          <i *ngIf="isListView" class="ri-grid-line fs-5"></i>
        </button>
      </div>

      <!-- Orders -->
      <div class="row g-4">

        <div *ngFor="let order of orderViewList 
      | paginate: { itemsPerPage: 20, currentPage: p } 
      | searchpipe: terms; index as i" [ngClass]="isListView ? 'col-12' : 'col-12 col-sm-6 col-lg-4 col-xxl-3'">

          <div class="card h-100 shadow-lg border-0 rounded-4 kds-card">

            <div class="order-timer" [ngClass]="getTimerClass(order.createdDate)">
              ⏱ {{ getElapsedTime(order.createdDate) }}
            </div>


            <!-- HEADER -->
            <div class="card-header d-flex justify-content-between align-items-center bg-dark text-white rounded-top-4">
              <div class="fs-4 fw-bold">
                #{{ order.orderNumber ?? order.orderId }}
              </div>
              <span class="badge px-3 py-2 fs-6" [ngClass]="{
            'bg-warning text-dark': order.orderStatus === 'NEW',
            'bg-info': order.orderStatus === 'COOKING',
            'bg-success': order.orderStatus === 'READY'
          }">
                {{ order.orderStatus }}
              </span>
            </div>

            <!-- BODY -->
            <div class="card-body p-4">

              <!-- META INFO -->
              <div class="d-flex justify-content-between flex-wrap mb-3 text-muted">
                <div>
                  <i class="ri-user-3-line me-1"></i>
                  <strong>{{ order.agentName }}</strong>
                </div>
                <div>
                  <i class="ri-time-line me-1"></i>
                  {{ order.time }}
                </div>
                <div class="fw-bold">
                  {{ order.pickupDinein }}
                </div>
              </div>

              <hr>

              <!-- ITEMS -->
              <div class="order-items">
                <div *ngFor="let item of order.menuList"
                  class="d-flex justify-content-between align-items-start py-2 border-bottom">

                  <div class="fs-5 fw-semibold">
                    {{ item.quantity }} × {{ item.itemName }}
                    <div *ngIf="item.notes" class="text-danger small mt-1">
                      📝 {{ item.notes }}
                    </div>
                  </div>

                  <div *ngIf="item.attributes" class="badge bg-light text-dark">
                    {{ item.attributes }}
                  </div>

                </div>
              </div>

            </div>

            <!-- FOOTER -->
            <div class="card-footer bg-light border-0 text-center">
              <button class="btn btn-lg btn-success w-75  shadow-sm" (click)="closeSingleOrders(order.orderId)">
                ✔ Complete Order
              </button>
            </div>

          </div>
        </div>

        <!-- PAGINATION -->
        <div class="col-12 text-center mt-4" *ngIf="orderViewList">
          <pagination-controls (pageChange)="p = $event"></pagination-controls>
        </div>

        <!-- EMPTY -->
        <div class="col-12 text-center text-muted fs-4" *ngIf="orderViewList.length < 1">
          No Orders in Kitchen
        </div>

      </div>

    </div>

  </div>
</div>
