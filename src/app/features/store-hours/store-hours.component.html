<div class="container-fluid px-2 px-md-3 py-3">
  <!-- Desktop view: table -->
  <div class="table-responsive d-none d-md-block">
    <table class="table table-hover align-middle bg-white rounded shadow-sm mb-0">
      <thead class="bg-light">
        <tr>
          <th class="py-3 px-3">Days</th>
          <th class="py-3 px-3">Store Opens</th>
          <th class="py-3 px-3">Store Closes</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let hrs of storeHoursList; let row = index">
          <td class="fw-semibold px-3">{{ hrs.days }}</td>

          <!-- Store Open -->
          <td>
            <div class="d-flex align-items-center gap-2">
              <input type="text"
                     class="form-control time-input"
                     style="width: 95px; text-align: center; font-family: monospace;"
                     [(ngModel)]="hrs.storeOpen"
                     [name]="'storeOpen-' + row"
                     placeholder="hh:mm" />
              <div class="btn-group btn-group-sm">
                <button class="btn"
                        [class.btn-primary]="hrs.openAmpm === 'AM'"
                        [class.btn-outline-primary]="hrs.openAmpm !== 'AM'"
                        (click)="hrs.openAmpm='AM'">AM</button>
                <button class="btn"
                        [class.btn-primary]="hrs.openAmpm === 'PM'"
                        [class.btn-outline-primary]="hrs.openAmpm !== 'PM'"
                        (click)="hrs.openAmpm='PM'">PM</button>
              </div>
            </div>
          </td>

          <!-- Store Close -->
          <td>
            <div class="d-flex align-items-center gap-2">
              <input type="text"
                     class="form-control time-input"
                     style="width: 95px; text-align: center; font-family: monospace;"
                     [(ngModel)]="hrs.storeClose"
                     [name]="'storeClose-' + row"
                     placeholder="hh:mm" />
              <div class="btn-group btn-group-sm">
                <button class="btn"
                        [class.btn-primary]="hrs.closeAmpm === 'AM'"
                        [class.btn-outline-primary]="hrs.closeAmpm !== 'AM'"
                        (click)="hrs.closeAmpm='AM'">AM</button>
                <button class="btn"
                        [class.btn-primary]="hrs.closeAmpm === 'PM'"
                        [class.btn-outline-primary]="hrs.closeAmpm !== 'PM'"
                        (click)="hrs.closeAmpm='PM'">PM</button>
              </div>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Mobile view: cards -->
  <div class="d-block d-md-none">
    <div class="row g-3">
      <div class="col-12" *ngFor="let hrs of storeHoursList; let row = index">
        <div class="card shadow-sm border-0 rounded-3">
          <div class="card-body p-3">
            <h6 class="fw-bold text-primary mb-3 pb-1 border-bottom border-primary border-2 d-inline-block">
              {{ hrs.days }}
            </h6>

            <!-- Store Open -->
            <div class="mb-3 mt-2">
              <label class="small fw-semibold text-muted mb-1">Store Opens</label>
              <div class="d-flex gap-2 align-items-center">
                <input type="text"
                       class="form-control form-control-sm"
                       style="flex: 1; text-align: center; font-family: monospace;"
                       [(ngModel)]="hrs.storeOpen"
                       [name]="'storeOpen-mob-' + row"
                       placeholder="hh:mm" />
                <div class="btn-group btn-group-sm">
                  <button class="btn"
                          [class.btn-primary]="hrs.openAmpm === 'AM'"
                          [class.btn-outline-primary]="hrs.openAmpm !== 'AM'"
                          (click)="hrs.openAmpm='AM'">AM</button>
                  <button class="btn"
                          [class.btn-primary]="hrs.openAmpm === 'PM'"
                          [class.btn-outline-primary]="hrs.openAmpm !== 'PM'"
                          (click)="hrs.openAmpm='PM'">PM</button>
                </div>
              </div>
            </div>

            <!-- Store Close -->
            <div>
              <label class="small fw-semibold text-muted mb-1">Store Closes</label>
              <div class="d-flex gap-2 align-items-center">
                <input type="text"
                       class="form-control form-control-sm"
                       style="flex: 1; text-align: center; font-family: monospace;"
                       [(ngModel)]="hrs.storeClose"
                       [name]="'storeClose-mob-' + row"
                       placeholder="hh:mm" />
                <div class="btn-group btn-group-sm">
                  <button class="btn"
                          [class.btn-primary]="hrs.closeAmpm === 'AM'"
                          [class.btn-outline-primary]="hrs.closeAmpm !== 'AM'"
                          (click)="hrs.closeAmpm='AM'">AM</button>
                  <button class="btn"
                          [class.btn-primary]="hrs.closeAmpm === 'PM'"
                          [class.btn-outline-primary]="hrs.closeAmpm !== 'PM'"
                          (click)="hrs.closeAmpm='PM'">PM</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="d-flex justify-content-center gap-3 mt-4 flex-wrap">
    <button class="btn px-4 py-2 rounded-pill fw-semibold"
            style="background-color: #2563eb; border: none; color: white;"
            (click)="onSaveAll()">
      <i class="bi bi-save me-1"></i> Save
    </button>
    <button class="btn btn-outline-danger px-4 py-2 rounded-pill fw-semibold"
            style="border-width: 1.5px;"
            (click)="onCancel()">
      <i class="bi bi-x-circle me-1"></i> Cancel
    </button>
  </div>
</div>
