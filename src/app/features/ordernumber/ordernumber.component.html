  </div>

  <!-- Desktop Table -->
  <div class="table-responsive d-none d-md-block">
    <table class="table table-hover align-middle bg-white rounded shadow-sm mb-0">
      <thead class="bg-light">
        <tr>
          <th class="py-3 px-3">#</th>
          <th class="py-3 px-3">Order Number</th>
          <th class="py-3 px-3 text-center">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="orderList.length === 0">
          <td colspan="8" class="text-center text-muted py-4">No orders found.</td>
        </tr>
        <tr  >
          <td class="px-3">{{ orderList[0]?.orderNumPk }}</td>
          <td class="px-3"> 
            <input type="number" class="shopify-input" id="orderNum-0"  [value]="orderList[0]?.orderNum || ''" />

          <!-- <input type="number" class="shopify-input" id="orderNum-0" value="{{ orderList[0].orderNumber }}"  /> -->
          
           
          </td>
          <td class="px-3 text-center">
            <div class="d-flex justify-content-center gap-1">
              <!-- <button class="btn btn-sm btn-outline-info rounded-pill px-2" (click)="onView(o)" title="View"><i class="bi bi-eye"></i></button> -->
              <button class="btn btn-sm btn-outline-primary rounded-pill px-2" (click)="onSave()" title="Edit"><i class="bi bi-pencil"></i></button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Mobile Cards -->
  <div class="d-block d-md-none">
    <div class="row g-3">
      <div *ngIf="orderList.length === 0" class="col-12 text-center text-muted py-4">No orders found.</div>
      <div class="col-12" *ngFor="let o of orderList">
        <div class="card shadow-sm border-0 rounded-3">
          <div class="card-body p-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h6 class="fw-bold text-primary mb-0">#{{ o.orderNum }}</h6>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-sm btn-outline-primary rounded-pill px-3 w-100" (click)="onEdit(o)"><i class="bi bi-pencil me-1"></i>Edit</button>
              <button class="btn btn-sm btn-outline-danger rounded-pill px-3 w-100" (click)="onDelete(o.orderNumPk)"><i class="bi bi-trash me-1"></i>Delete</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- View Modal -->
  <div class="modal fade" id="orderViewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content rounded-3 border-0 shadow">
        <div class="modal-header bg-info text-white rounded-top-3">
          <h5 class="modal-title fw-bold"><i class="bi bi-eye me-2"></i>Order Details</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4" *ngIf="selectedOrder">
          <div class="row g-3">
            <div class="col-6 col-md-4"><span class="small text-muted d-block">Order Number</span><strong>#{{ selectedOrder.orderNum }}</strong></div>
          </div>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal fade" id="orderModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content rounded-3 border-0 shadow">
        <div class="modal-header bg-primary text-white rounded-top-3">
          <h5 class="modal-title fw-bold"><i class="bi bi-hash me-2"></i>{{ isEdit ? 'Edit' : 'Add' }} Order</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label class="form-label small fw-semibold">Order Number</label>
              <input type="text" class="form-control" [(ngModel)]="formData.orderNum" placeholder="Order Number" />
            </div>
          </div>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary rounded-pill px-4 fw-semibold" (click)="onSave()">
            <i class="bi bi-save me-1"></i> Save
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
