<div class="card border-0 shadow-sm mt-4">
  <div class="card-body">

    <div *ngIf="spinnerDataLoad" class="text-center py-5">
      <div class="spinner-border text-danger" style="width: 3rem; height: 3rem;" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-2 text-muted">Loading products...</p>
    </div>

    <div class="product-grid" *ngIf="!spinnerDataLoad">
      <div class="product-card" *ngFor="let product of productViewList" (click)="viewProduct(product)">

        <div class="product-image-wrap">
          <img class="product-image"
               [src]="'data:' + product.imageMimeType + ';base64,' + product.productImage"
               [alt]="product.productName">
        </div>

        <div class="product-body">
          <h5 class="product-title" [title]="product.productName">{{ product.productName }}</h5>

          <div class="product-meta">
            <span class="product-price">$ {{ product.unitPrice }}</span>
            <span class="product-expiry">Expires: {{ product.expiryDate | date:'yyyy-MM-dd' }}</span>
          </div>
        </div>

      </div>
    </div>

    <div *ngIf="!spinnerDataLoad && productViewList.length === 0" class="text-center text-muted py-5">
      No expired products found.
    </div>

  </div>
</div>
