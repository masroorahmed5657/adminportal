<div class="shopify-main-container">

  <h2 class="shopify-page-title">
    Expired Products
  </h2>

  <!-- ================= LOADER ================= -->
  <div class="shopify-loading" *ngIf="spinnerDataLoad">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>

    <p>Loading expired products...</p>
  </div>

  <ng-container *ngIf="!spinnerDataLoad">

    <!-- ================= EMPTY STATE ================= -->
    <div class="shopify-empty" *ngIf="productViewList.length === 0">
      <h5>No expired products</h5>
      <p>Nothing has expired in the last {{ expiryDays }} days.</p>
    </div>

    <!-- ================= PRODUCT GRID ================= -->
    <div class="expired-products-grid" *ngIf="productViewList.length > 0">

      <div class="shopify-card" *ngFor="let product of productViewList">

        <!-- Product Image -->
        <img class="shopify-product-image" [src]="'data:' + product.imageMimeType + ';base64,' + product.productImage"
          [alt]="product.productName" onerror="this.src='assets/images/no-image.png'">

        <!-- Product Body -->
        <div class="shopify-card__body">

          <h6 class="shopify-product-title">
            {{ product.productName }}
          </h6>

          <div class="shopify-badge shopify-badge--muted">
            $ {{ product.unitPrice }}
          </div>

          <div class="shopify-badge shopify-badge--danger">
            Expires on
            {{ product.expiryDate | date:'yyyy-MM-dd' }}
          </div>

        </div>

      </div>

    </div>

  </ng-container>

</div>
