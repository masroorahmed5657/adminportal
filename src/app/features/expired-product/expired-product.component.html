<div class="shopify-main-container">

  <h2 class="shopify-page-title">Expired Products</h2>

  <!-- Loader -->
  <div class="shopify-loading" *ngIf="spinnerDataLoad">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p>Loading expired products...</p>
  </div>

  <ng-container *ngIf="!spinnerDataLoad">

    <!-- Empty state -->
    <div class="shopify-empty" *ngIf="productViewList.length === 0">
      <h5>No expired products</h5>
      <p>Nothing has expired in the last {{ expiryDays }} days.</p>
    </div>

    <div class="row g-3" *ngIf="productViewList.length > 0">
      <div class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2" *ngFor="let product of productViewList">

        <div class="shopify-card h-100">
          <img class="w-100" style="aspect-ratio:1/1; object-fit:cover; border-bottom:1px solid var(--shopify-border, #e3e3e3);"
            [src]="'data:' + product.imageMimeType + ';base64,' + product.productImage"
            [alt]="product.productName">

          <div class="shopify-card__body text-center">
            <h6 class="fw-semibold mb-2">{{ product.productName }}</h6>

            <span class="shopify-badge shopify-badge--muted d-block mb-2">
              $ {{ product.unitPrice }}
            </span>

            <span class="shopify-badge shopify-badge--danger d-block">
              Expires on {{ product.expiryDate | date:'yyyy-MM-dd' }}
            </span>
          </div>
        </div>

      </div>
    </div>

  </ng-container>
</div>
