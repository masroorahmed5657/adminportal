<!-- ============================================================
     CATEGORY — LIST VIEW
     ============================================================ -->
<div class="shopify-main-container" *ngIf="showCategoryListFlag && !addFlag">

  <h2 class="shopify-page-title">Categories</h2>

  <!-- Search row -->
  <div class="shopify-search-row">
    <div>
      <label class="shopify-field-label" for="category">Search Category</label>
      <div class="shopify-input-group">
        <span class="shopify-input-group__prefix"><i class="bi bi-search"></i></span>
        <input type="text" class="shopify-input" placeholder="Search by category" id="category"
          [(ngModel)]="searchCategory" (ngModelChange)="categorySearch()">
      </div>
    </div>
    <div>
      <label class="shopify-field-label" for="subCategory">Search Sub Category</label>
      <div class="shopify-input-group">
        <span class="shopify-input-group__prefix"><i class="bi bi-search"></i></span>
        <input type="text" class="shopify-input" placeholder="Search by sub category" id="subCategory"
          [(ngModel)]="searchSubCategory" (ngModelChange)="categorySearch()">
      </div>
    </div>
  </div>

  <!-- Actions row -->
  <div class="shopify-actions-row">
    <button class="btn-shopify btn-shopify--primary" (click)="addCategory()">
      <i class="bi bi-plus-lg"></i> Add Category
    </button>
    <label for="documents" class="shopify-file-label">
      <i class="bi bi-upload"></i> Upload Category
    </label>
    <input type="file" id="documents" class="d-none" accept=".xlsx,.xls,.csv"
      (change)="uploadCategory($event)" multiple>
  </div>

  <!-- Loader -->
  <div class="shopify-loading" *ngIf="spinnerDataLoad">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p>Loading categories...</p>
  </div>

  <ng-container *ngIf="!spinnerDataLoad">

    <!-- Empty state -->
    <div class="shopify-empty" *ngIf="categoryList.length === 0">
      <h5>Sorry! No result found</h5>
      <p>No categories match your search.</p>
    </div>

    <ng-container *ngIf="categoryList.length > 0">

      <!-- Desktop table -->
      <div class="shopify-table-wrap">
        <table class="shopify-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Category</th>
              <th>Sub Category</th>
              <th>Image</th>
              <th>Popular</th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let cat of pagedCategoryList; let i = index" [ngClass]="{'is-active': activeRow === rowIndex(i)}">
              <td>{{ cat.categoryId }}</td>
              <td>
                <input type="text" class="shopify-input" id="category-{{rowIndex(i)}}"
                  [(ngModel)]="cat.category" [disabled]="!enabledEdit[rowIndex(i)]">
              </td>
              <td>
                <input type="text" class="shopify-input" id="subCategory-{{rowIndex(i)}}"
                  [(ngModel)]="cat.subCategory" [disabled]="!enabledEdit[rowIndex(i)]">
              </td>
              <td>
                <img [src]="'data:' + cat.imageType + ';base64,' + cat.finalImage" alt="" class="shopify-avatar">
              </td>
              <td>
                <label class="shopify-switch">
                  <input type="checkbox" id="popularFlag-{{rowIndex(i)}}" [(ngModel)]="cat.popularFlag"
                    [disabled]="!enabledEdit[rowIndex(i)]">
                  <span class="shopify-switch__slider"></span>
                </label>
              </td>
              <td>
                <div class="shopify-table__actions">
                  <button *ngIf="!enabledEdit[rowIndex(i)]" class="btn-shopify btn-shopify--outline btn-shopify--icon"
                    title="Edit" (click)="startEdit(rowIndex(i))">
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button *ngIf="enabledEdit[rowIndex(i)]" class="btn-shopify btn-shopify--success btn-shopify--icon"
                    title="Save" (click)="onSave(cat.categoryId, rowIndex(i))">
                    <i class="bi bi-check-lg"></i>
                  </button>
                  <button class="btn-shopify btn-shopify--danger btn-shopify--icon" title="Delete"
                    (click)="onDelete(cat.categoryId, rowIndex(i))">
                    <i class="bi bi-trash"></i>
                  </button>
                  <button class="btn-shopify btn-shopify--outline btn-shopify--icon" title="Image"
                    (click)="openPopup(rowIndex(i))">
                    <i class="bi bi-camera"></i>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Mobile cards -->
      <div class="shopify-mobile-list">
        <div class="shopify-mobile-card" *ngFor="let cat of pagedCategoryList; let i = index"
          [ngClass]="{'is-active': activeRow === rowIndex(i)}">
          <div class="shopify-mobile-card__row">
            <span class="shopify-field-label--sm">ID</span>
            <span>{{ cat.categoryId }}</span>
          </div>
          <div class="shopify-mobile-card__field">
            <label class="shopify-field-label--sm">Category</label>
            <input type="text" class="shopify-input" [(ngModel)]="cat.category" [disabled]="!enabledEdit[rowIndex(i)]">
          </div>
          <div class="shopify-mobile-card__field">
            <label class="shopify-field-label--sm">Sub Category</label>
            <input type="text" class="shopify-input" [(ngModel)]="cat.subCategory" [disabled]="!enabledEdit[rowIndex(i)]">
          </div>
          <div class="shopify-mobile-card__field text-center">
            <label class="shopify-field-label--sm d-block">Image</label>
            <img [src]="'data:' + cat.imageType + ';base64,' + cat.finalImage" class="shopify-avatar"
              style="width:64px;height:64px;">
          </div>
          <div class="shopify-toggle-row">
            <span class="shopify-field-label--sm">Popular</span>
            <label class="shopify-switch">
              <input type="checkbox" [(ngModel)]="cat.popularFlag" [disabled]="!enabledEdit[rowIndex(i)]"
                id="popularFlagM-{{rowIndex(i)}}">
              <span class="shopify-switch__slider"></span>
            </label>
          </div>
          <div class="shopify-mobile-card__actions">
            <button *ngIf="!enabledEdit[rowIndex(i)]" class="btn-shopify btn-shopify--outline btn-shopify--sm"
              (click)="startEdit(rowIndex(i))">
              <i class="bi bi-pencil"></i> Edit
            </button>
            <button *ngIf="enabledEdit[rowIndex(i)]" class="btn-shopify btn-shopify--success btn-shopify--sm"
              (click)="onSave(cat.categoryId, rowIndex(i))">
              <i class="bi bi-check-lg"></i> Save
            </button>
            <button class="btn-shopify btn-shopify--danger btn-shopify--sm" (click)="onDelete(cat.categoryId, rowIndex(i))">
              <i class="bi bi-trash"></i> Delete
            </button>
            <button class="btn-shopify btn-shopify--outline btn-shopify--sm" (click)="openPopup(rowIndex(i))">
              <i class="bi bi-camera"></i> Image
            </button>
          </div>
        </div>
      </div>

      <!-- Pagination (Shopify-style Previous / Next) -->
      <div class="shopify-pager" *ngIf="totalPages > 1">
        <button class="btn-shopify btn-shopify--outline btn-shopify--sm" [disabled]="page <= 1"
          (click)="goToPage(page - 1)">
          <i class="bi bi-chevron-left"></i> Previous
        </button>
        <span class="shopify-pager__info">Page {{ page }} of {{ totalPages }}</span>
        <button class="btn-shopify btn-shopify--outline btn-shopify--sm" [disabled]="page >= totalPages"
          (click)="goToPage(page + 1)">
          Next <i class="bi bi-chevron-right"></i>
        </button>
      </div>

    </ng-container>
  </ng-container>
</div>

<!-- ============================================================
     CATEGORY — ADD FORM
     ============================================================ -->
<div class="shopify-main-container" *ngIf="addFlag">

  <div class="shopify-actions-row" *ngIf="showCategoryListFlag">
    <button class="btn-shopify btn-shopify--outline" (click)="backToList()">
      <i class="bi bi-arrow-left"></i> Back to Category List
    </button>
  </div>

  <div class="shopify-card">
    <div class="shopify-card__header">Add category / sub category</div>
    <div class="shopify-card__body">
      <div class="shopify-grid-4">
        <div>
          <label class="shopify-field-label">Category</label>
          <input type="text" class="shopify-input" id="category-new" placeholder="Category">
        </div>
        <div>
          <label class="shopify-field-label">Sub Category</label>
          <input type="text" class="shopify-input" id="subCategory-new" placeholder="Sub category">
        </div>
        <div>
          <label class="shopify-field-label">Image</label>
          <input type="file" class="shopify-input" accept="image/*" (change)="selectFile($event)">
        </div>
        <div>
          <label class="shopify-field-label">&nbsp;</label>
          <div class="shopify-toggle-row" style="padding-top:0.3rem;">
            <span>Popular</span>
            <label class="shopify-switch">
              <input type="checkbox" id="popularFlag-new">
              <span class="shopify-switch__slider"></span>
            </label>
          </div>
        </div>
      </div>

      <div class="mt-3">
        <button class="btn-shopify btn-shopify--primary" (click)="onSave(-1, -1)">
          <i class="bi bi-save"></i> Save
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ============================================================
     IMAGE UPLOAD MODAL
     ============================================================ -->
<div class="shopify-modal-backdrop" [ngStyle]="{'display':displayStyle}" (click)="closePopup()"></div>
<div class="shopify-modal" [ngStyle]="{'display':displayStyle}" tabindex="-1" role="dialog">
  <div class="shopify-modal__dialog">
    <div class="shopify-modal__header">
      <h4 class="shopify-modal__title">Upload Image</h4>
      <button class="btn-shopify btn-shopify--outline btn-shopify--icon" (click)="closePopup()">✕</button>
    </div>
    <div class="shopify-modal__body">
      <label for="files" class="shopify-file-label">
        <i class="bi bi-upload"></i> Choose category image
      </label>
      <input type="file" id="files" name="files" style="display:none;" accept="image/*"
        (change)="selectFile($event)">

      <img [src]="preview" class="shopify-modal__preview" *ngIf="preview">
    </div>
    <div class="shopify-modal__footer">
      <button type="button" class="btn-shopify btn-shopify--outline" (click)="closePopup()">Close</button>
      <button type="button" class="btn-shopify btn-shopify--primary" (click)="uploadImage()">Upload</button>
    </div>
  </div>
</div>
