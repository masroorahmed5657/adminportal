<!-- ============================================================
     BRAND — LIST VIEW
     ============================================================ -->
<div class="shopify-main-container" *ngIf="!addFlag">

  <!-- <h2 class="shopify-page-title">Brands</h2> -->

  <!-- Search row -->
  <div class="shopify-search-row">
    <div>
      <label class="shopify-field-label" for="searchCode">Search Code</label>
      <div class="shopify-input-group">
        <span class="shopify-input-group__prefix"><i class="bi bi-search"></i></span>
        <input type="text" class="shopify-input" placeholder="Search by code" id="searchCode" [(ngModel)]="searchCode"
          (ngModelChange)="brandSearch()">
      </div>
    </div>
    <div>
      <label class="shopify-field-label" for="searchName">Search Name</label>
      <div class="shopify-input-group">
        <span class="shopify-input-group__prefix"><i class="bi bi-search"></i></span>
        <input type="text" class="shopify-input" placeholder="Search by name" id="searchName" [(ngModel)]="searchName"
          (ngModelChange)="brandSearch()">
      </div>
    </div>
  </div>

  <!-- Actions row -->
  <div class="shopify-actions-row">
    <button type="button" class="btn-shopify btn-shopify--primary" (click)="addbrand()">
      <i class="bi bi-plus-lg"></i> Add Brand
    </button>
    <label for="documents" class="shopify-file-label">
      <i class="bi bi-upload"></i> Upload Brands
    </label>
    <input type="file" id="documents" class="d-none" accept=".xlsx,.xls,.csv" (change)="uploadBrands($event)" multiple>
  </div>

  <!-- Loader -->
  <div class="shopify-loading" *ngIf="spinnerDataLoad">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p>Loading brands...</p>
  </div>

  <ng-container *ngIf="!spinnerDataLoad">

    <!-- Empty state -->
    <div class="shopify-empty" *ngIf="brandList.length === 0">
      <h5>Brand not found</h5>
      <p>No brands match your search.</p>
    </div>

    <ng-container *ngIf="brandList.length > 0">

      <!-- Desktop table -->
      <div class="shopify-table-wrap">
        <table class="shopify-table">
          <thead>
            <tr>
              <th>Brand ID</th>
              <th>Brand Code</th>
              <th>Brand Name</th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let brnd of pagedBrandList; let i = index" [ngClass]="{'is-active': activeRow === rowIndex(i)}">
              <td>{{ brnd.brandId }}</td>
              <td>
                <input type="text" class="shopify-input" id="brandCode-{{ rowIndex(i) }}" [(ngModel)]="brnd.brandCode"
                  [disabled]="!enabledEdit[rowIndex(i)]">
              </td>
              <td>
                <input type="text" class="shopify-input" id="brandName-{{ rowIndex(i) }}" [(ngModel)]="brnd.brandName"
                  [disabled]="!enabledEdit[rowIndex(i)]">
              </td>
              <td>
                <div class="shopify-table__actions">
                  <button *ngIf="!enabledEdit[rowIndex(i)]" class="btn-shopify btn-shopify--outline btn-shopify--icon"
                    title="Edit" (click)="startEdit(rowIndex(i))">
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button *ngIf="enabledEdit[rowIndex(i)]" class="btn-shopify btn-shopify--success btn-shopify--icon"
                    title="Save" (click)="onSave(brnd.brandId, rowIndex(i))">
                    <i class="bi bi-check-lg"></i>
                  </button>
                  <button class="btn-shopify btn-shopify--danger btn-shopify--icon" title="Delete"
                    (click)="onDelete(brnd.brandId, rowIndex(i))">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Mobile cards -->
      <div class="shopify-mobile-list">
        <div class="shopify-mobile-card" *ngFor="let brnd of pagedBrandList; let i = index"
          [ngClass]="{'is-active': activeRow === rowIndex(i)}">
          <div class="shopify-mobile-card__row">
            <span class="shopify-field-label--sm">Brand ID</span>
            <span>{{ brnd.brandId }}</span>
          </div>
          <div class="shopify-mobile-card__field">
            <label class="shopify-field-label--sm">Brand Code</label>
            <input type="text" class="shopify-input" [(ngModel)]="brnd.brandCode"
              [disabled]="!enabledEdit[rowIndex(i)]">
          </div>
          <div class="shopify-mobile-card__field">
            <label class="shopify-field-label--sm">Brand Name</label>
            <input type="text" class="shopify-input" [(ngModel)]="brnd.brandName"
              [disabled]="!enabledEdit[rowIndex(i)]">
          </div>
          <div class="shopify-mobile-card__actions">
            <button *ngIf="!enabledEdit[rowIndex(i)]" class="btn-shopify btn-shopify--outline btn-shopify--sm"
              (click)="startEdit(rowIndex(i))">
              <i class="bi bi-pencil"></i> Edit
            </button>
            <button *ngIf="enabledEdit[rowIndex(i)]" class="btn-shopify btn-shopify--success btn-shopify--sm"
              (click)="onSave(brnd.brandId, rowIndex(i))">
              <i class="bi bi-check-lg"></i> Save
            </button>
            <button class="btn-shopify btn-shopify--danger btn-shopify--sm"
              (click)="onDelete(brnd.brandId, rowIndex(i))">
              <i class="bi bi-trash"></i> Delete
            </button>
          </div>
        </div>
      </div>

      <!-- Pagination (Shopify-style Previous / Next) -->
      <div class="shopify-pager" *ngIf="totalPages > 1">
        <button class="btn-shopify btn-shopify--outline btn-shopify--sm" [disabled]="page <= 1"
          (click)="goToPage(page - 1)">
          <i class="bi bi-chevron-left"></i> Previous
        </button>
        <span class="shopify-pager__info">Page {{ page }} of {{ totalPages }}</span>
        <button class="btn-shopify btn-shopify--outline btn-shopify--sm" [disabled]="page >= totalPages"
          (click)="goToPage(page + 1)">
          Next <i class="bi bi-chevron-right"></i>
        </button>
      </div>

    </ng-container>
  </ng-container>
</div>

<!-- ============================================================
     BRAND — ADD FORM
     ============================================================ -->
<div class="shopify-main-container" *ngIf="addFlag">

  <div class="shopify-actions-row" *ngIf="showBrandListFlag">
    <button class="btn-shopify btn-shopify--outline" (click)="backToList()">
      <i class="bi bi-arrow-left"></i> Back to Brand List
    </button>
  </div>

  <div class="shopify-card">
    <div class="shopify-card__header">Add new brand</div>
    <div class="shopify-card__body">
      <div class="shopify-grid-3">
        <div>
          <label class="shopify-field-label">Brand Code</label>
          <input type="text" class="shopify-input" id="brandCode-new" placeholder="Brand code">
        </div>
        <div>
          <label class="shopify-field-label">Brand Name</label>
          <input type="text" class="shopify-input" id="brandName-new" placeholder="Brand name">
        </div>
        <div class="d-flex align-items-end">
          <button class="btn-shopify btn-shopify--primary w-100" (click)="onSave(-1, -1)">
            <i class="bi bi-save"></i> Save Brand
          </button>
        </div>
      </div>
    </div>
  </div>

</div>
