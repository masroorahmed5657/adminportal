<!-- ============================================================
     EXPENSE CATEGORY — LIST VIEW
     ============================================================ -->
<div class="shopify-main-container" *ngIf="!addFlag">

  <!-- Search row -->
  <div class="shopify-search-row">
    <div>
      <label class="shopify-field-label" for="searchCode">Search Code</label>
      <div class="shopify-input-group">
        <span class="shopify-input-group__prefix"><i class="bi bi-search"></i></span>
        <input type="text" class="shopify-input" placeholder="Search by code" id="searchCode"
          [(ngModel)]="searchCode" (ngModelChange)="categorySearch()">
      </div>
    </div>
    <div>
      <label class="shopify-field-label" for="searchName">Search Name</label>
      <div class="shopify-input-group">
        <span class="shopify-input-group__prefix"><i class="bi bi-search"></i></span>
        <input type="text" class="shopify-input" placeholder="Search by name" id="searchName"
          [(ngModel)]="searchName" (ngModelChange)="categorySearch()">
      </div>
    </div>
  </div>

  <!-- Actions row -->
  <div class="shopify-actions-row">
    <button type="button" class="btn-shopify btn-shopify--primary" (click)="addCategory()">
      <i class="bi bi-plus-lg"></i> Add Category
    </button>
  </div>

  <!-- Loader -->
  <div class="shopify-loading" *ngIf="spinnerDataLoad">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p>Loading categories...</p>
  </div>

  <ng-container *ngIf="!spinnerDataLoad">

    <!-- Empty state -->
    <div class="shopify-empty" *ngIf="pagedCategoryList.length === 0">
      <h5>No categories found</h5>
      <p>No expense categories match your search.</p>
    </div>

    <ng-container *ngIf="pagedCategoryList.length > 0">

      <!-- Desktop table -->
      <div class="shopify-table-wrap">
        <table class="shopify-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Category Code</th>
              <th>Category Name</th>
              <th>Status</th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let cat of pagedCategoryList; let i = index"
              [ngClass]="{'is-active': activeRow === rowIndex(i)}">
              <td>{{ cat.expenseCategoryId }}</td>
              <td>
                <input type="text" class="shopify-input" id="categoryCode-{{ rowIndex(i) }}"
                  [(ngModel)]="cat.categoryCode" [disabled]="!enabledEdit[rowIndex(i)]">
              </td>
              <td>
                <input type="text" class="shopify-input" id="categoryName-{{ rowIndex(i) }}"
                  [(ngModel)]="cat.categoryName" [disabled]="!enabledEdit[rowIndex(i)]">
              </td>
              <td>
                <select class="shopify-select" [(ngModel)]="cat.status" [disabled]="!enabledEdit[rowIndex(i)]">
                  <option [ngValue]="1">Active</option>
                  <option [ngValue]="0">Inactive</option>
                </select>
              </td>
              <td>
                <div class="shopify-table__actions">
                  <button *ngIf="!enabledEdit[rowIndex(i)]" class="btn-shopify btn-shopify--outline btn-shopify--icon"
                    title="Edit" (click)="startEdit(rowIndex(i))">
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button *ngIf="enabledEdit[rowIndex(i)]" class="btn-shopify btn-shopify--success btn-shopify--icon"
                    title="Save" (click)="onSave(cat.expenseCategoryId!, rowIndex(i))" [disabled]="isSaving">
                    <i class="bi bi-check-lg"></i>
                  </button>
                  <button class="btn-shopify btn-shopify--danger btn-shopify--icon" title="Delete"
                    (click)="onDelete(cat.expenseCategoryId!, rowIndex(i))">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Mobile cards -->
      <div class="shopify-mobile-list">
        <div class="shopify-mobile-card" *ngFor="let cat of pagedCategoryList; let i = index"
          [ngClass]="{'is-active': activeRow === rowIndex(i)}">
          <div class="shopify-mobile-card__row">
            <span class="shopify-field-label--sm">Category ID</span>
            <span>{{ cat.expenseCategoryId }}</span>
          </div>
          <div class="shopify-mobile-card__field">
            <label class="shopify-field-label--sm">Category Code</label>
            <input type="text" class="shopify-input" [(ngModel)]="cat.categoryCode"
              [disabled]="!enabledEdit[rowIndex(i)]">
          </div>
          <div class="shopify-mobile-card__field">
            <label class="shopify-field-label--sm">Category Name</label>
            <input type="text" class="shopify-input" [(ngModel)]="cat.categoryName"
              [disabled]="!enabledEdit[rowIndex(i)]">
          </div>
          <div class="shopify-mobile-card__field">
            <label class="shopify-field-label--sm">Status</label>
            <select class="shopify-select" [(ngModel)]="cat.status" [disabled]="!enabledEdit[rowIndex(i)]">
              <option [ngValue]="1">Active</option>
              <option [ngValue]="0">Inactive</option>
            </select>
          </div>
          <div class="shopify-mobile-card__actions">
            <button *ngIf="!enabledEdit[rowIndex(i)]" class="btn-shopify btn-shopify--outline btn-shopify--sm"
              (click)="startEdit(rowIndex(i))">
              <i class="bi bi-pencil"></i> Edit
            </button>
            <button *ngIf="enabledEdit[rowIndex(i)]" class="btn-shopify btn-shopify--success btn-shopify--sm"
              (click)="onSave(cat.expenseCategoryId!, rowIndex(i))" [disabled]="isSaving">
              <i class="bi bi-check-lg"></i> Save
            </button>
            <button class="btn-shopify btn-shopify--danger btn-shopify--sm"
              (click)="onDelete(cat.expenseCategoryId!, rowIndex(i))">
              <i class="bi bi-trash"></i> Delete
            </button>
          </div>
        </div>
      </div>

      <!-- Pagination (Shopify-style Previous / Next) -->
      <div class="shopify-pager" *ngIf="totalPages > 1">
        <button class="btn-shopify btn-shopify--outline btn-shopify--sm" [disabled]="page <= 1"
          (click)="goToPage(page - 1)">
          <i class="bi bi-chevron-left"></i> Previous
        </button>
        <span class="shopify-pager__info">Page {{ page }} of {{ totalPages }}</span>
        <button class="btn-shopify btn-shopify--outline btn-shopify--sm" [disabled]="page >= totalPages"
          (click)="goToPage(page + 1)">
          Next <i class="bi bi-chevron-right"></i>
        </button>
      </div>

    </ng-container>
  </ng-container>
</div>

<!-- ============================================================
     EXPENSE CATEGORY — ADD FORM
     ============================================================ -->
<div class="shopify-main-container" *ngIf="addFlag">

  <div class="shopify-actions-row" *ngIf="showCategoryListFlag">
    <button class="btn-shopify btn-shopify--outline" (click)="backToList()">
      <i class="bi bi-arrow-left"></i> Back to Category List
    </button>
  </div>

  <div class="shopify-card">
    <div class="shopify-card__header">Add new expense category</div>
    <div class="shopify-card__body">
      <div class="shopify-grid-3">
        <div>
          <label class="shopify-field-label">Category Code</label>
          <input type="text" class="shopify-input" [(ngModel)]="newCategory.categoryCode"
            placeholder="Category code">
        </div>
        <div>
          <label class="shopify-field-label">Category Name <span class="text-danger">*</span></label>
          <input type="text" class="shopify-input" [(ngModel)]="newCategory.categoryName"
            placeholder="e.g., Office Supplies">
        </div>
        <div>
          <label class="shopify-field-label">Status</label>
          <select class="shopify-select" [(ngModel)]="newCategory.status">
            <option [ngValue]="1">Active</option>
            <option [ngValue]="0">Inactive</option>
          </select>
        </div>
      </div>
      <div class="shopify-actions-row mt-3">
        <button class="btn-shopify btn-shopify--primary" (click)="onSave(-1, -1)" [disabled]="isSaving">
          <span *ngIf="isSaving" class="spinner-border spinner-border-sm me-1"></span>
          <i *ngIf="!isSaving" class="bi bi-save"></i> Save Category
        </button>
      </div>
    </div>
  </div>

</div>
