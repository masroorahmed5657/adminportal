<div class="shopify-page barcode-component">

    <div class="shopify-page__header">
        <!-- <h1 class="shopify-page__title">Barcode Generator</h1> -->
    </div>

    <div class="shopify-card p-3">

        <!-- Barcode Type Selector -->
        <div class="d-flex align-items-center gap-2 mb-3">
            <label class="fw-bold mb-0">Barcode Type:</label>
            <select class="shopify-select" style="width:auto;" [(ngModel)]="barcodeType">
                <option *ngFor="let opt of barcodeTypeOptions" [value]="opt.value">{{opt.label}}</option>
            </select>
        </div>

        <div class="d-flex flex-wrap align-items-center gap-2 mb-3">

            <!-- Code input (QR / 2D / 2D-sized / 2D8-sized) -->
            <input *ngIf="needsCode" type="text" class="shopify-input" style="max-width:220px;"
                placeholder="Enter UPC / code" [(ngModel)]="code">

            <!-- URL input (QR from URL) -->
            <input *ngIf="needsUrl" type="text" class="shopify-input" style="max-width:280px;"
                placeholder="Enter URL (https://...)" [(ngModel)]="url">

            <!-- Width / Height (only for sized 2D types) -->
            <ng-container *ngIf="needsSize">
                <div class="d-flex align-items-center gap-1">
                    <label class="fw-bold mb-0" style="white-space:nowrap;">Width:</label>
                    <input type="number" class="shopify-input" style="width:90px;" [(ngModel)]="width">
                </div>
                <div class="d-flex align-items-center gap-1">
                    <label class="fw-bold mb-0" style="white-space:nowrap;">Height:</label>
                    <input type="number" class="shopify-input" style="width:90px;" [(ngModel)]="height">
                </div>
            </ng-container>

            <input type="text" class="shopify-input" style="max-width:200px;" placeholder="Label name (optional)"
                [(ngModel)]="labelName">
            <input type="number" class="shopify-input" style="max-width:130px;" placeholder="Price (optional)"
                [(ngModel)]="labelPrice">
            <div class="d-flex align-items-center gap-1">
                <label class="fw-bold mb-0" style="white-space:nowrap;">Copies:</label>
                <input type="number" class="shopify-input" style="width:80px;" min="1" [(ngModel)]="copies">
            </div>
        </div>

        <div class="d-flex gap-2 mb-3">
            <button class="btn-shopify btn-shopify--outline" [disabled]="loading" (click)="createBarcode()">
                {{ loading ? 'Creating...' : 'Create Barcode' }}
            </button>
            <button class="btn-shopify btn-shopify--primary" [disabled]="!barcodeImage" (click)="printBarcode()">
                Print
            </button>
            <button class="btn-shopify btn-shopify--outline" (click)="clear()">
                Clear
            </button>
        </div>

        <div class="text-center" *ngIf="barcodeImage">
            <img src='data:image/png;base64,{{barcodeImage}}' alt="Barcode" style="max-height:90px;">
            <p class="mb-0 mt-2"><strong>{{ needsUrl ? url : code }}</strong></p>
            <p class="mb-0" *ngIf="labelName">{{labelName}}
                <span *ngIf="labelPrice"> - {{currencySign}} {{labelPrice | number:'1.2-2'}}</span>
            </p>
        </div>

    </div>

</div>
