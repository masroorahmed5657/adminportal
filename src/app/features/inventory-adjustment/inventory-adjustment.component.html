<div class="shopify-main-container">

  <div class="shopify-card mb-4">
    <div class="shopify-card__header">Search Product</div>
    <div class="shopify-card__body">

      <div class="shopify-grid-3">
        <!-- Barcode -->
        <div>
          <label class="shopify-field-label">Scan Barcode <i class="bi bi-upc-scan"></i></label>
          <div class="shopify-input-group">
            <span class="shopify-input-group__prefix"><i class="bi bi-upc-scan"></i></span>
            <input type="text" class="shopify-input" placeholder="Search by Barcode"
              [(ngModel)]="upc" (keyup)="upcSearch($event)">
          </div>
        </div>

        <!-- Name -->
        <div class="position-relative">
          <label class="shopify-field-label">Name</label>
          <div class="shopify-input-group">
            <span class="shopify-input-group__prefix"><i class="bi bi-search"></i></span>
            <input type="search" class="shopify-input" placeholder="Search By Name"
              (keyup)="onNameSearch($event)" [(ngModel)]="searchText" autocomplete="off">
          </div>

          <!-- Search result list -->
          <ul class="list-group position-absolute w-100 shadow-sm" *ngIf="productList.length > 0"
            style="z-index: 1000; max-height: 250px; overflow-y: auto;">
            <li class="list-group-item list-group-item-action" *ngFor="let product of productList"
              (click)="selectProduct(product)">
              {{ product.productName }}
              <small class="text-muted d-block">
                {{ product.sku }} | {{ (product.salePrice === null ? product.unitPrice : product.salePrice) | number:'1.2-2' }}
              </small>
            </li>
          </ul>
        </div>

        <!-- SKU -->
        <div>
          <label class="shopify-field-label">Enter SKU <i class="bi bi-tag"></i></label>
          <div class="shopify-input-group">
            <span class="shopify-input-group__prefix"><i class="bi bi-tag"></i></span>
            <input type="text" class="shopify-input" placeholder="Search by SKU"
              [(ngModel)]="sku" (keyup)="skuSearch($event)">
          </div>
        </div>
      </div>

      <!-- Product Image -->
      <div class="text-center my-4" *ngIf="product.imageMimeType">
        <img [src]="'data:' + product.imageMimeType + ';base64,' + product.productImage"
          class="img-fluid rounded shadow-sm" style="max-height:220px" alt="Product Image">
      </div>

      <!-- Product Details -->
      <div class="shopify-card__header mt-3">Product Details</div>
      <div class="shopify-grid-3 mt-3">
        <div>
          <span class="shopify-field-label--sm d-block">Name</span>
          <span class="fw-semibold">{{ product.productName }}</span>
        </div>
        <div>
          <span class="shopify-field-label--sm d-block">Qty in Stock</span>
          <span class="fw-semibold">{{ product.quantity }}</span>
        </div>
        <div>
          <label class="shopify-field-label">Qty Adjusted</label>
          <input type="number" class="shopify-input" [(ngModel)]="adjQty" required>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="shopify-actions-row mt-4 pt-3 border-top justify-content-center">
        <button class="btn-shopify btn-shopify--primary" (click)="onSubmit()">
          <i class="bi bi-check-lg"></i> Submit
        </button>
        <button class="btn-shopify btn-shopify--outline" (click)="clear()">
          <i class="bi bi-x-lg"></i> Clear
        </button>
      </div>

    </div>
  </div>

</div>
