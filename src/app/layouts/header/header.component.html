<!--=============== HEADER ===============-->
<header class="admin-header fixed-top" id="header">
  <div class="admin-header__container d-flex align-items-center justify-content-between px-4">

    <!-- Left: Toggle Button -->
    <button class="admin-header__toggle" id="header-toggle" (click)="showHideMenuBar()" title="Toggle menu">
      <i class="ri-menu-2-line"></i>
    </button>

    <!-- Center: Current Page Title -->
    <div class="admin-header__title flex-grow-1 text-center">
      <span>{{ currentPageTitle }} Management</span>
    </div>

    <!-- Right: Brand / User -->
    <div class="admin-header__brand d-flex align-items-center">
      <span class="admin-header__avatar">
        <i class="ri-cloud-fill"></i>
      </span>
      <span class="admin-header__brand-text">Admin Portal</span>
    </div>

  </div>
</header>
